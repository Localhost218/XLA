# Nhãn góc nhìn theo chuỗi VisDrone2019-DET (train 208 chuỗi, val 76 chuỗi), đọc bằng xla/degrade/sources.py.
# Khoá "<split>/<mã chuỗi>" (mã chuỗi = phần trước dấu '_' đầu tiên của tên ảnh; 24 mã trùng giữa train và val
# nên kèm split).
#
# Soát: 2026-11-18, agent lane degrade, theo lệnh Owner. Lưới `python -m xla.degrade.sources seq-sheet --per-sheet 24`
# (D:/DevCache/cache/degrade/seq_review/, 12 tờ): mỗi chuỗi 3 khung đầu / giữa / cuối theo tên, ô 260×160 px; xem
# bằng mắt từng tờ.
# Lớp:
#   nadir   — trục camera lệch ≲ 20–25° so với thẳng đứng: không thấy chân trời, thấy mặt trên mái nhà / nóc xe / đầu
#             người, mặt tường nhà gần như không thấy.
#   near    — "gần nadir" ≲ 35°: nhìn dốc, thấy chút mặt tường hoặc phối cảnh nhẹ, không thấy chân trời.
#   oblique — xiên hơn: thấy đường chạy ra xa, mặt tường lớn, chân trời hoặc trời.
#   mixed   — ba khung khác nhau rõ (chuỗi 99999xx của VisDrone là tập ảnh nhiều góc gom lại, đều xếp mixed):
#             từng ảnh của chuỗi đi qua bộ lọc sky + CLIP của configs/sources.yaml.
# Giới hạn: chỉ thấy 3 khung / chuỗi; chuỗi dài (n > 20) có thể có khung khác lớp mà không bị bắt.
# Tổng: nadir 14, near 21, oblique 160, mixed 89 (= 284).
