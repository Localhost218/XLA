# Nhãn góc nhìn soát tay cho nguồn ngoài (AI v2 phase 02), đọc bằng xla/degrade/sources.py
# (`load_external_view_labels`). Cùng định nghĩa lớp với configs/visdrone_view.yaml:
#   nadir   — trục camera lệch ≲ 20–25° so với thẳng đứng: không thấy chân trời, thấy đỉnh đầu / vai người.
#   near    — "gần nadir" ≲ 35°: nhìn dốc, phối cảnh nhẹ, không thấy chân trời.
#   oblique — xiên hơn: thấy chân trời / trời, mặt đất chạy ra xa, người thấy rõ thân từ bên cạnh.
#   mixed   — (chỉ cho nhóm) nhóm có nhiều góc: từng ảnh đi qua probe.
# Thứ tự quyết: nhãn ảnh (`images`) → nhãn nhóm (`groups`, khoá "<bộ>/<nhóm>") → probe CLIP ≥ external.min_probe_nadir.
# `images` là mẫu soát tay 100 ảnh/bộ (seed ghi ở `review`), dùng để đo precision của probe trên bộ đó.
reviewed: 2026-11-25
method: "agent lane data-ext soát mắt lưới `seq-sheet --source <bộ> --n 100 --seed 20261125` (ô 360×270, chưa hiện điểm probe khi soát)"
# Kết quả: {'heridal': {'nadir': 93, 'near': 7, 'oblique': 0}, 'tinyperson': {'nadir': 11, 'near': 19, 'oblique': 70}, 'wisard': {'nadir': 38, 'near': 24, 'oblique': 38}}
review:
  seed: 20261125
  n_per_set: 100
  sheet_dir: D:/DevCache/cache/degrade/external_review
# Nhãn nhóm (quyết sau khi soát, 25/11): HERIDAL 100/100 ảnh mẫu là nadir/near trên 16/17 nơi bay (số ảnh mẫu mỗi
# nơi ở cột phải) trong khi probe CLIP (học trên VisDrone đô thị) chỉ nhận 77/100 → gán nadir theo nơi bay để không bỏ
# 23 % ảnh tốt. CAB (8 ảnh, không có trong mẫu) vẫn qua probe. WiSARD: một chuyến, mẫu có 38/100 xiên → mixed (probe).
