# Phase 05 AI v2 — thầy YOLO11l/m @1280 + nhãn giả khung dev v1 (plan 261125-ai-v2, D5, D6, D8, Deferred 8).
# Đọc bằng `python -m xla.detect.selftrain teacher|pseudo --config configs/teacher_v2.yaml`.
#
# TRẦN GPU: plan ghi 6 giờ; chủ dự án CẮT xuống 1 giờ cho cả phase 05 (smoke + train + nhãn giả + chấm), quyết định
# 25/11/2026 vì tốc độ. Vì vậy thầy fine-tune từ checkpoint có sẵn (không học lại từ COCO) trên một tập con cố định của
# d02x, số epoch do `time_h` của ultralytics cắt. Giờ GPU dùng thật ghi ở results/v2/teacher/README.md.

version: 2
runs_dir: D:/DevCache/runs/xla/v2/detect          # run + trọng số, ngoài repo
datasets_dir: D:/DevCache/datasets/xla            # tập huấn luyện sinh ra (v2_teacher/, pseudo_v2/), ngoài repo
lock_timeout_s: 21600                             # chờ khoá GPU (D6) tối đa 6 giờ
gpu_cap_h: 1.0                                    # trần GPU cả phase (chủ dự án 25/11; plan gốc 6 giờ)
source_set: d02x                                  # VisDrone D0 + D2 + HERIDAL + WiSARD (phase 02)
seed: 20261125

data:
  n_source_train: 3600        # ảnh d02x train mỗi epoch (tập con cố định, chia đều theo `source`, seed): vừa trần giờ
  n_source_val: 800           # ảnh d02x val để chọn checkpoint (tập con cố định, chia theo `source`)
  mine_background: true       # khung `mine` (neg_flight_split.json) vào train với nhãn rỗng (§14.2)
  mine_max_frac: 0.10         # ảnh nền ≤ 10 % tập train (phase 05 bước 2)

train:                        # truyền thẳng cho ultralytics `model.train` (công thức E1, results/e1/README.md E1-3)
  imgsz: 1280
  workers: 4                  # ≤ 4 (luật máy)
  seed: 20261118
  deterministic: true
  device: 0
  optimizer: AdamW            # như E1 (auto chọn SGD lr 0,01 khi số bước > 10 000, l bị vậy)
  lr0: 0.002
  cos_lr: true                # chủ dự án 25/11
  warmup_epochs: 0.5
  close_mosaic: 1
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  mosaic: 1.0
  amp: true
  val: true                   # val d02x (tập con) mỗi epoch = cách chọn checkpoint (mAP50), không khung thật nào
  plots: false
  cache: false
  patience: 1000              # dừng sớm do callback theo mAP50 val (`early_stop_patience`), không theo fitness

teacher:
  size: m                     # smoke chọn l (results/v2/teacher/smoke.json); l bỏ sau epoch 1 (val mAP50 0,005, xem README) → m
  candidates:                 # l: COCO; m: last.pt thầy E2 (YOLO11m @1280 trên D2, không khung thật, không chọn bằng dev-val)
    l: yolo-weights/yolo11l.pt
    m: D:/DevCache/runs/xla/e2/teacher/weights/last.pt
  batch: 2
  epochs: 20                  # trần trên; `time_h` cắt trước
  time_h: 0.55                # giờ train tối đa (ultralytics `time`): 1 giờ − smoke − run l đã bỏ (0,21 h) − nhãn giả
  early_stop_patience: 5      # epoch không tăng mAP50 val → dừng
  vram_max_gb: 7.6            # smoke: VRAM đỉnh > mức này coi như không vừa 8 GB
  min_img_iters: 6000         # l chỉ được chọn nếu trong `time_h` học được ≥ ngần này ảnh (không thì m)

smoke:
  n_train: 120                # ~60 bước batch 2: chỉ đo VRAM + giây/ảnh, không phải một epoch 10 %
  n_val: 60
  sizes: [l, m]

pseudo:                       # nhãn giả khung dev v1 (như E2), ByteTrack chỉ để làm sạch nhãn giả (D4)
  tta: true
  det_conf: 0.01
  max_gap_s: 1.0
  tracker:
    tracker_type: bytetrack
    track_high_thresh: 0.05
    track_low_thresh: 0.01
    new_track_thresh: 0.1
    track_buffer: 15
    match_thresh: 0.9
    fuse_score: false
  min_track_len: 3
  tau_low: 0.05
  tau_high_grid: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
  precision_min: 0.9          # τ_cao của fold j chọn trên nhãn devpool của CHÍNH fold j (model fold i ≠ j mới dùng nhãn đó)
  match_iou: 0.5
  drop_frames_with_unkept_high: true
  out_dir: D:/DevCache/datasets/xla/pseudo_v2

predict:
  conf: 0.001
  max_det: 300
