visdrone:
  root: visdrone
  subsets:                       # thư mục con → split của tập sinh
    VisDrone2019-DET-train: train
    VisDrone2019-DET-val: val

nomad:
  enabled: true
  root: nomad
  min_visibility: 30             # hộp visibility < 30 % coi là vùng bỏ qua (không dương, không âm)
  val_actor_mod: 10              # diễn viên số chia hết cho 10 → val (tách theo người, tránh rò cảnh)

# AI v2 phase 02: nguồn ngoài có giấy phép (khối downloads ở trên). CHỈ vào tập trộn d02x (`build --set d02x`);
# d0/d1/d2 v1 vẫn chỉ VisDrone. `python -m xla.degrade.sources extract` kiểm sha256 file nén rồi giải nén phần
# include vào <data_root>/<root>/<bộ>/, ghi manifest.jsonl (đường dẫn tương đối + sha256 + bytes từng file) và
# extract.json (sha256 file nén, sha256 manifest). Không ảnh nào vào git.
external:
  root: external                     # tương đối data_root (configs/paths.yaml) → D:/DevCache/datasets/xla/external
  archive_dir: datasets              # tương đối downloads_dir → D:/IOT_Tools/downloads/datasets
  view_labels_file: configs/view_external.yaml
  accept_views: [nadir, near]        # như VisDrone (nadir.accept_views)
  min_probe_nadir: 0.8               # probe CLIP fit trên nhãn VisDrone (`probe-external`), cùng ngưỡng VisDrone
  probe_scores_file: probe_scores.jsonl   # tương đối external root
  clip_cache: clip_emb_external_ViT-B-32.npz   # tương đối cache_dir/degrade (đặc trưng CLIP ảnh ngoài)
  sets:
    heridal:
      archives: [heridal/heridal_keras_retinanet_voc.zip]
      include: ["heridal_keras_retinanet_voc/JPEGImages/*", "heridal_keras_retinanet_voc/Annotations/*",
                "heridal_keras_retinanet_voc/ImageSets/Main/*"]
      exclude: ["__MACOSX/*"]
      subdir: heridal_keras_retinanet_voc
      classes: [person]
      # Chia theo NƠI BAY (mã trong tên ảnh), không theo ảnh. ImageSets/Main/val.txt của bộ là ảnh ngẫu nhiên từ
      # train (cùng nơi) nên không dùng. val = 4 nơi chỉ có trong test gốc (BLI, CAB, GRO, MOB) + RAK, TRS
      # + SB (217/1684 ảnh = 12,9 %).
      val_groups: [BLI, CAB, GRO, MOB, RAK, SB, TRS]
      # Ảnh 4000×3000: cắt ô 1280×960 (cùng tỉ lệ 4:3 với khung) chồng mép 160 px TRƯỚC khi đặt cửa sổ / làm xấu.
      tile: {w: 1280, h: 960, overlap: 160, min_keep_area_frac: 0.5, neg_tiles_per_image: 1}
      windows_per_image: 1           # mỗi ô một cửa sổ (đã nhiều ô mỗi ảnh)
      use: [detector, verifier]
      d02x: true
    tinyperson:
      archives: [tinyperson/train.tar.gz, tinyperson/test.tar.gz, tinyperson/tiny_set_train.json,
                 tinyperson/tiny_set_test.json]
      # Chỉ ảnh có trong json (labeled_images + pure_bg_images); no_label_images / labeled_dense_images không nhãn.
      include: ["train/labeled_images/*", "train/pure_bg_images/*", "test/labeled_images/*", "test/pure_bg_images/*",
                "tiny_set_*.json"]
      splits: {train: train, test: val}   # json gốc; nhóm = video (bb_V0032…), train/test không chung video nào
      ignore_flags: [ignore, uncertain, logo]   # hộp mang cờ → vùng bỏ qua (như category 0 VisDrone)
      # Sau lọc góc chỉ 173/1532 ảnh (< 200, Risk phase 02): KHÔNG vào d02x, chỉ làm lớp dương cho verifier (phase 07
      # đọc bằng sources.select_external(cfg, for_d02x=False) rồi lọc source == "tinyperson"). results/v2/data/README.md.
      use: [verifier]
      d02x: false
    wisard:
      archives: [wisard/WiSARD_Multi_Modal_Sample.zip]
      include: ["*_VIS_*/*"]         # chỉ RGB; *_IR_* (nhiệt) không giải nén
      exclude: ["*_IR_*/*"]
      split: train                   # một chuyến bay = một cảnh: không chia val từ bộ này
      use: [detector, verifier]
      d02x: true

keep_images_without_person: true  # ảnh nadir không người vẫn dùng cho cửa sổ âm

# Phase 07 (lệnh Owner 18/11): val VisDrone sau lọc chỉ 69 ảnh có người → chuyển 10/75 chuỗi train (seed 20261118)
# sang val, val còn 238 ảnh có người. Danh sách sinh bằng `python -m xla.degrade.sources pick-val`.
val_split_file: configs/visdrone_valsplit.yaml

geometry:                        # hình học chung D0/D1/D2 (xla/degrade/geometry.py); cỡ người đích lấy từ
  windows_per_image: 2           # camera_profile.yaml person_box_px.short_side (cùng phân bố cho cả ba tập)
  window:
    neg_window_frac: 0.2         # 20 % cửa sổ không người
    min_keep_area_frac: 0.6      # hộp bị cắt còn ≥ 60 % diện tích mới giữ
    min_box_px: 2.0
    max_tries: 40
    allow_upscale: false         # không phóng to ảnh nguồn

nadir:
  scores_file: nadir_scores.jsonl   # cache điểm (sources.py score), tương đối src_datasets_dir
  clip_model: ViT-B-32
  clip_pretrained: laion2b_s34b_b79k
  metadata: {}                      # source → nadir | oblique khi metadata quyết được; NOMAD chỉ có khoảng cách, không có góc
  # Bộ lọc CHÍNH từ 18/11 (lệnh Owner): nhãn góc nhìn soát tay (configs/visdrone_view.yaml): 284 chuỗi + 192 ảnh.
  # Ảnh/chuỗi có lớp trong accept_views → nhận; lớp khác → loại; chuỗi mixed (chủ yếu 99999xx: tập ảnh rời, mỗi
  # ảnh một góc; 5 873/7 019 ảnh VisDrone) → từng ảnh qua probe: probe_nadir ≥ min_probe_nadir.
  # Vì sao probe thay sky + CLIP cho mixed (lệch lệnh Owner, có số đo): trên 192 ảnh mixed soát tay, sky + CLIP cũ
  # precision 0,15 (nadir chặt) / 0,52 (nadir + near), AUC CLIP 0,61 / 0,48 — gần như đoán. Probe = logistic
  # (C=1, cân lớp) trên đặc trưng ảnh CLIP ViT-B-32, học từ nhãn soát tay (`python -m xla.degrade.sources fit-probe`),
  # kiểm chéo 5 phần trên 192 ảnh mixed: nadir chặt P ≤ 0,43 (không dùng được); nadir + near t 0,8: P 0,93, R 0,42.
  # accept_views nới sang near (≲ 35°) theo luật Owner: nadir chặt ước ~9 % ảnh mixed (18/192) + 45 ảnh chuỗi nadir
  # ≈ 520 ảnh có người < 800.
  view_labels_file: configs/visdrone_view.yaml
  accept_views: [nadir, near]
  probe_scores_file: nadir_probe_scores.jsonl   # sources.py fit-probe, tương đối src_datasets_dir
  min_probe_nadir: 0.8
  exclude_sources:                  # nguồn loại khỏi tập nguồn nadir (giữ code tải + manifest để dùng lại nếu cần)
    nomad: >-
      Ảnh NOMAD a10/a30 đã tải (420 ảnh, Actor001–009) đều nhìn xiên ~45–60° (agent xem ảnh 18/11), camera thật nhìn
      thẳng xuống. clip_nadir của NOMAD ~0,99 là CLIP chấm sai (không chân trời ≠ nadir). Loại theo lệnh Owner 18/11.
  # --- bộ lọc sky + CLIP: chỉ còn dùng khi không có view_labels_file / min_probe_nadir (lịch sử: bộ lọc chính
  #     đầu 18/11, precision 0,50) ---
  # Ngưỡng chọn 18/11 trên 100 ảnh có người lấy ngẫu nhiên (seed 20261118; 92 VisDrone + 8 NOMAD), agent tự soát
  # bằng lưới ảnh nhỏ (python -m xla.degrade.sources review-sheet). Nhãn tay "nadir" = nhìn dốc gần thẳng xuống,
  # không thấy chân trời, mặt tường nhà không chiếm ưu thế: 28/100.
  # AUC của clip_nadir trên 100 ảnh này = 0,74 (ViT-B-32 laion2b, câu mô tả trong sources.py). Đã thử ViT-L-14
  # datacomp_xl (0,69) và bộ câu mô tả khác (0,71–0,74): không hơn, giữ ViT-B-32.
  # Chọn sky ≤ 0,05 và clip ≥ 0,40: giữ 30/100, precision 0,50, recall 0,54 (clip ≥ 0,5: 24 ảnh, 0,54 / 0,46).
  # Bộ lọc yếu: khoảng một nửa ảnh giữ lại vẫn nhìn xiên — ghi trong báo cáo phase 05, phase 07/10 có thể siết.
  max_sky_frac: 0.05
  min_clip_nadir: 0.40
  review:
    date: 2026-11-18
    n: 100
    seed: 20261118
    sheet_dir: D:/DevCache/cache/degrade/nadir_review
    nadir_idx: [15, 21, 24, 25, 26, 27, 31, 34, 36, 50, 52, 56, 57, 61, 62, 65, 66, 68, 74, 78, 83, 84, 86, 87, 89,
                92, 96, 97]
    auc_clip: 0.74
    precision: 0.50
    recall: 0.54
