  visdrone:
    license: "VisDrone (AISKYEYE), chỉ dùng nghiên cứu phi thương mại"
    files:
      - name: VisDrone2019-DET-train.zip
        url: https://github.com/ultralytics/assets/releases/download/v0.0.0/VisDrone2019-DET-train.zip
        bytes: 1549875511
        sha256: 86a77eba93137bfc16e4993860de9245b0675c0dba0d3ab98fb458699e256f84
        downloaded: 2026-11-18
      - name: VisDrone2019-DET-val.zip
        url: https://github.com/ultralytics/assets/releases/download/v0.0.0/VisDrone2019-DET-val.zip
        bytes: 81638851
        sha256: abeea063037e5d20398837deb11084e652402a34ddf4f207bdf541a6f2a35ef9
        downloaded: 2026-11-18
  nomad:
